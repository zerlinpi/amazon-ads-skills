name: Validate Agent Skills

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "references/**"
      - "schemas/**"
      - "playbooks/**"
      - "evals/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/validate-skills.yml"
  pull_request:
    paths:
      - "skills/**"
      - "references/**"
      - "schemas/**"
      - "playbooks/**"
      - "evals/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/validate-skills.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run repository unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate repository skills
        run: python scripts/validate_skills.py .
      - name: Validate eval fixture contracts
        run: python scripts/validate_evals.py .
